<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none">
  <!-- icon: the desktop app's mark, neon strokes on a near-black tile -->
  <defs>
    <linearGradient id="tw-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f22"/><stop offset="1" stop-color="#020208"/></linearGradient>
    <linearGradient id="tw-neon" x1="43.75" y1="0" x2="156.25" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22e5f2"/><stop offset="1" stop-color="#f05cd8"/></linearGradient>
  </defs>
  <rect width="200" height="200" rx="46" fill="url(#tw-bg)"/>
  <path d="M43.75 56.25H156.25M100 56.25V106.25M43.75 106.25L71.875 156.25L100 106.25M100 106.25L128.125 156.25L156.25 106.25"
